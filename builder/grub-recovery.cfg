# /boot/grub/grub.cfg for Arvor Linux Dedicated Recovery Partition
# Fully standalone bootloader configuration independent of main system LVM

set default=0
set timeout=5

insmod part_gpt
insmod part_msdos
insmod ext2
insmod fat
insmod font
insmod gfxterm

# Set high-resolution recovery console if supported
if loadfont /boot/grub/fonts/unicode.pf2 ; then
    set gfxmode=auto
    terminal_output gfxterm
fi

# Locate dedicated recovery partition by filesystem label
search --no-floppy --set=root --label ARVOR_RECOVERY

menuentry "Arvor Linux Recovery Mode (Safe Environment)" --class arvor --class gnu-linux --class os {
    echo "Loading Arvor Recovery Kernel..."
    linux /live/vmlinuz boot=live toram components quiet splash arvor_recovery=1 rd.live.image
    echo "Loading Arvor Recovery Initramfs..."
    initrd /live/initrd.img
}

menuentry "Arvor Linux Recovery Mode (Debug Verbose Console)" --class arvor --class gnu-linux --class os {
    echo "Loading Arvor Recovery Kernel (Verbose)..."
    linux /live/vmlinuz boot=live toram components debug verbose arvor_recovery=1 rd.live.image systemd.debug_shell=1
    echo "Loading Arvor Recovery Initramfs..."
    initrd /live/initrd.img
}

menuentry "Return to Main OS Bootloader" {
    search --no-floppy --set=root --file /EFI/arvor-linux/grubx64.efi
    chainloader /EFI/arvor-linux/grubx64.efi
}

menuentry "UEFI Firmware Settings" {
    fwsetup
}

menuentry "Reboot System" {
    reboot
}
